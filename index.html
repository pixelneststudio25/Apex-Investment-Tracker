<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Apex</title>
  <meta name="theme-color" content="#0A1020">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <main class="shell">
    <h1>Apex</h1>
    <hr class="gold-rule">
    <p class="muted">Every asset, on record.</p>
    <section class="card" aria-label="Token check">
      <p class="muted">Total current value</p>
      <p class="hero-value num">₦12,450,000.00</p>
      <p class="num gain">▲ +₦1,250,000.00 (+11.16%)</p>
      <p class="num loss">▼ −₦300,000.00 (−2.40%)</p>
    </section>
    <button id="theme-toggle" class="btn btn--secondary" type="button">Switch theme</button>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
